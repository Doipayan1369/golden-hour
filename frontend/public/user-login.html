<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Portal — Case Progress</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#F8FAFC; color:#111317; }
      .card { max-width:720px;margin:48px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(17,19,23,0.06);} 
      .input { width:100%;padding:12px 14px;border-radius:10px;border:1px solid #e6e9ef;margin-top:8px;font-weight:600 }
      .btn { background:#D4FF00;border:none;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer;margin-top:12px }
      a.back { display:inline-block;margin-top:10px;color:#111317;text-decoration:none }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin:0 0 6px 0;">User Portal — Track Your Case</h2>
      <p style="margin:0 0 18px 0;color:#475569;">Enter your Case ID, phone number, or registered reference to view progress.</p>

      <form id="loginForm">
        <label class="sr-only">Case ID or Reference</label>
        <input id="caseInput" class="input" placeholder="e.g. CASE-2026-041 or 9876543210" />
        <button class="btn" type="submit">View Progress</button>
      </form>

      <a class="back" href="/">← Back to Console</a>

      <div id="msg" style="margin-top:14px;color:#7b8794;font-size:13px"></div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const input = document.getElementById('caseInput');
      const msg = document.getElementById('msg');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const v = input.value && input.value.trim();
        if (!v) { msg.textContent = 'Please enter a case ID or reference.'; return; }
        // Redirect to the progress page with query param 'case'
        window.location.href = `/user-progress.html?case=${encodeURIComponent(v)}`;
      });
    </script>
  </body>
</html>
