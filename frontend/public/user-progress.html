<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Case Progress</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#F8FAFC; color:#111317; }
      .card { max-width:900px;margin:28px auto;padding:22px;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(17,19,23,0.06);} 
      .muted { color:#6b7280; }
      .step { padding:12px;border-radius:10px;border:1px solid #eef2ff;margin-bottom:10px;background:linear-gradient(180deg,#fff,#fbfefc); }
      .badge { display:inline-block;padding:6px 10px;border-radius:999px;background:#E6F3D0;color:#15421a;font-weight:700;font-size:13px }
      a.back { display:inline-block;margin-top:10px;color:#111317;text-decoration:none }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 id="title">Case Progress</h2>
      <p id="subtitle" class="muted">Lookup case status and timeline.</p>

      <div id="loader" style="margin:14px 0;color:#7b8794">Loading…</div>
      <div id="content" style="display:none">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div id="caseId" style="font-weight:800;font-size:16px"></div>
            <div id="caseDesc" class="muted" style="margin-top:6px"></div>
          </div>
          <div id="statusBadge"></div>
        </div>

        <hr style="margin:14px 0;border:none;border-top:1px solid #eef2f7" />

        <h3 style="margin:8px 0">Progress Timeline</h3>
        <div id="timeline"></div>

        <hr style="margin:14px 0;border:none;border-top:1px solid #eef2f7" />

        <h3 style="margin:8px 0">Actions</h3>
        <div id="actions" class="muted"></div>

        <a class="back" id="backLink" href="/user-login.html">← Back</a>
      </div>

      <div id="error" style="display:none;color:#b91c1c;margin-top:12px"></div>
    </div>

    <script>
      function qs(name) {
        const u = new URL(window.location.href);
        return u.searchParams.get(name);
      }
      const caseParam = qs('case');
      const loader = document.getElementById('loader');
      const content = document.getElementById('content');
      const error = document.getElementById('error');

      async function renderCase(id) {
        try {
          loader.style.display = 'block';
          error.style.display = 'none';
          const res = await fetch(`/api/cases/${encodeURIComponent(id)}`);
          if (!res.ok) {
            throw new Error('Not found');
          }
          const c = await res.json();

          document.getElementById('caseId').textContent = c.case_id || id;
          document.getElementById('caseDesc').textContent = c.short_description || (c.title || 'No title');

          const sb = document.getElementById('statusBadge');
          sb.innerHTML = `<span class="badge">${(c.status||'UNKNOWN').toUpperCase()}</span>`;

          const timeline = document.getElementById('timeline');
          timeline.innerHTML = '';
          // Prefer a case.history or actions array if present
          const events = c.timeline || c.history || c.actions || [];
          if (events.length === 0) {
            timeline.innerHTML = '<div class="muted">No timeline available for this case yet.</div>';
          } else {
            events.forEach(ev => {
              const d = document.createElement('div');
              d.className = 'step';
              d.innerHTML = `<div style="font-weight:700">${ev.title || ev.action || ev.type || 'Event'}</div><div class="muted" style="margin-top:6px">${ev.detail || ev.note || ev.description || JSON.stringify(ev)}</div><div class="muted" style="margin-top:8px;font-size:12px">${ev.timestamp || ev.created_at || ''}</div>`;
              timeline.appendChild(d);
            });
          }

          const actions = document.getElementById('actions');
          actions.innerHTML = '';
          if (c.actions && c.actions.length) {
            c.actions.forEach(a => {
              const el = document.createElement('div');
              el.className='muted';
              el.textContent = `${a.type || 'Action'} — ${a.status || 'PENDING'} — ${a.created_at || ''}`;
              actions.appendChild(el);
            });
          } else {
            actions.innerHTML = '<div class="muted">No recorded actions yet.</div>';
          }

          loader.style.display = 'none';
          content.style.display = 'block';
        } catch (err) {
          loader.style.display = 'none';
          error.style.display = 'block';
          error.textContent = 'Unable to load case. Please check the Case ID and try again.';
          content.style.display = 'none';
        }
      }

      if (!caseParam) {
        loader.style.display = 'none';
        error.style.display = 'block';
        error.textContent = 'No case identifier provided. Please go back and enter your reference.';
      } else {
        renderCase(caseParam);
      }
    </script>
  </body>
</html>
