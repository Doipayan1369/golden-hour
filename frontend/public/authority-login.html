<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authority Login — Golden Hour Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#F8FAFC; color:#111317; }
      .card { max-width:720px;margin:48px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(17,19,23,0.06);} 
      .select, .btn { width:100%;padding:12px 14px;border-radius:10px;border:1px solid #e6e9ef;margin-top:8px;font-weight:600 }
      .btn { background:#111317;color:#D4FF00;border:none;margin-top:16px }
      a.back { display:inline-block;margin-top:10px;color:#111317;text-decoration:none }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin:0 0 6px 0;">Authority Login</h2>
      <p style="margin:0 0 18px 0;color:#475569;">Select your organisation and role to enter the console.</p>

      <select class="select" id="org">
        <option>I4C - Ministry of Home Affairs</option>
        <option>Haryana State Cyber Crime Police</option>
        <option>Bank D Nodal Fraud Desk</option>
      </select>

      <select class="select" id="role">
        <option>I4C_STATE_ANALYST</option>
        <option>LOCAL_BEAT_OFFICER</option>
        <option>BANK_NODAL_INVESTIGATOR</option>
      </select>

      <button id="enterBtn" class="btn">Enter Intelligence Console</button>

      <a class="back" href="/">← Back to Console</a>
    </div>

    <script>
      document.getElementById('enterBtn').addEventListener('click', () => {
        // Simple redirect to the SPA root; SPA login flow still controls demo access.
        window.location.href = '/';
      });
    </script>
  </body>
</html>
